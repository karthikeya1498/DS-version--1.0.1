name: phase8-operations

on:
  push:
    branches: [main, database/history-orm-archival]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  operational-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install -e '.[dev,ml]'
      - name: Validate Phase 8 operations
        run: pytest -q tests/test_phase8_operations.py tests/test_architecture_visibility.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        run: npm ci --prefix frontend && npm run build --prefix frontend
