services:
  optima-api:
    build: .
    image: optima-x-api:latest
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://optima:optima@postgres:5432/optima_x
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    image: optima-x-dashboard:latest
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      - optima-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optima_x
      POSTGRES_USER: optima
      POSTGRES_PASSWORD: optima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optima -d optima_x"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
